name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lua: ['5.1', 'luajit-2.1', '5.3']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Lua
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: ${{ matrix.lua }}

      - name: Setup LuaRocks
        uses: leafo/gh-actions-luarocks@v6

      - name: Install dependencies
        run: |
          luarocks install luafilesystem
          luarocks install luasocket
          luarocks install luacheck
          luarocks install luacov
          # Pre-install mediator_lua and penlight from git (broken archive URLs on luarocks.org)
          git clone --depth 1 https://github.com/Olivine-Labs/mediator_lua.git /tmp/mediator_lua
          cd /tmp/mediator_lua && luarocks make --deps-mode=none
          git clone --depth 1 --branch 1.15.0 https://github.com/lunarmodules/penlight.git /tmp/penlight
          cd /tmp/penlight && luarocks make --deps-mode=none
          # Install busted normally — luarocks sees mediator_lua + penlight already installed, installs remaining deps
          luarocks install busted

      - name: Lint
        run: luacheck src/yar/ spec/ example/

      - name: Test rockspec
        run: luarocks make --local

      - name: Test with coverage
        run: busted --coverage

      - name: Generate coverage report
        run: luacov

      - name: Print coverage summary
        run: tail -30 luacov.report.out

      - name: Upload coverage to Codecov
        if: matrix.lua == '5.1'
        uses: codecov/codecov-action@v4
        with:
          files: ./luacov.report.out
          flags: lua-${{ matrix.lua }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # 无 luasocket 环境测试：验证软依赖优雅降级
  no-luasocket:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Lua
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: '5.1'

      - name: Setup LuaRocks
        uses: leafo/gh-actions-luarocks@v6

      - name: Install busted (no luasocket)
        run: |
          luarocks install luafilesystem
          git clone --depth 1 https://github.com/Olivine-Labs/mediator_lua.git /tmp/mediator_lua
          cd /tmp/mediator_lua && luarocks make --deps-mode=none
          git clone --depth 1 --branch 1.15.0 https://github.com/lunarmodules/penlight.git /tmp/penlight
          cd /tmp/penlight && luarocks make --deps-mode=none
          luarocks install busted

      - name: Test rockspec (no luasocket)
        run: luarocks make --local

      - name: Test without luasocket
        run: busted spec/soft_dependency_spec.lua

  # OpenResty 兼容性 + 端到端测试
  # K3 提案：cosocket 注入、连接池参数透传、HTTP Provider 委托、content_by_lua 上下文、并发安全
  # 使用 Docker 镜像打包全部依赖（OpenResty + Lua 5.1 + PHP 8.2 + yar/msgpack/pcntl）
  # 本地复现：bash test/openresty/docker.sh
  openresty:
    needs: [interop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build OpenResty Docker image
        run: docker build -t lua-yar-openresty test/openresty/

      - name: Compatibility tests (resty CLI, with coverage)
        run: docker run --rm -v "$(pwd):/app" -w /app lua-yar-openresty resty -e 'require("luacov.runner").init()' test/resty_test.lua

      - name: E2E tests — cosocket TCP + connection pool + HTTP provider + concurrency (with coverage)
        run: docker run --rm -v "$(pwd):/app" -w /app lua-yar-openresty resty -e 'require("luacov.runner").init()' test/openresty_e2e_test.lua

      - name: E2E tests — HTTP content_by_lua (nginx)
        run: docker run --rm -v "$(pwd):/app" -w /app lua-yar-openresty bash test/openresty_http_e2e.sh

      - name: Concurrent — PHP 50 并发 → OpenResty HTTP (2 workers, 协程并发)
        run: docker run --rm -v "$(pwd):/app" -w /app lua-yar-openresty bash test/openresty/concurrent_openresty.sh http

      - name: Concurrent — PHP 50 并发 → OpenResty TCP (2 workers, stream 协程并发)
        run: docker run --rm -v "$(pwd):/app" -w /app lua-yar-openresty bash test/openresty/concurrent_openresty.sh tcp

      - name: Generate E2E coverage report
        run: docker run --rm -v "$(pwd):/app" -w /app lua-yar-openresty luacov

      - name: Upload E2E coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./luacov.report.out
          flags: openresty-e2e
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # E2E 测试：Lua 自操作 + PHP-Lua 互通（JSON + Msgpack）
  # 场景 1：Lua → Lua (HTTP)    JSON + Msgpack
  # 场景 2：Lua → Lua (TCP)     JSON + Msgpack
  # 场景 3：PHP → Lua (HTTP)    JSON + Msgpack
  # 场景 4：PHP → Lua (TCP)     JSON + Msgpack
  # 场景 5：Lua → PHP (HTTP)    JSON + Msgpack
  # 使用 Docker 镜像打包全部依赖（Lua 5.1 + luasocket + PHP 8.2 + yar/msgpack/pcntl）
  # 本地复现：bash test/e2e/docker.sh
  interop:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build E2E Docker image
        run: docker build -t lua-yar-e2e test/e2e/

      - name: E2E environment check
        run: docker run --rm -v "$(pwd):/app" -w /app lua-yar-e2e bash test/e2e/check_env.sh

      - name: E2E — Lua → Lua (HTTP, JSON + Msgpack)
        run: docker run --rm -v "$(pwd):/app" -w /app lua-yar-e2e bash test/e2e/lua_to_lua_http.sh

      - name: E2E — Lua → Lua (TCP, JSON + Msgpack)
        run: docker run --rm -v "$(pwd):/app" -w /app lua-yar-e2e bash test/e2e/lua_to_lua_tcp.sh

      - name: E2E — PHP → Lua (HTTP, JSON + Msgpack)
        run: docker run --rm -v "$(pwd):/app" -w /app lua-yar-e2e bash test/e2e/php_to_lua_http.sh

      - name: E2E — PHP → Lua (TCP, JSON + Msgpack)
        run: docker run --rm -v "$(pwd):/app" -w /app lua-yar-e2e bash test/e2e/php_to_lua_tcp.sh

      - name: E2E — Lua → PHP (HTTP, JSON + Msgpack)
        run: docker run --rm -v "$(pwd):/app" -w /app lua-yar-e2e bash test/e2e/lua_to_php_http.sh

      - name: Concurrent — PHP 3 并发 → Lua HTTP (顺序处理)
        run: docker run --rm -v "$(pwd):/app" -w /app lua-yar-e2e bash test/e2e/concurrent_e2e.sh native-http

      - name: Concurrent — PHP 3 并发 → Lua TCP (顺序处理)
        run: docker run --rm -v "$(pwd):/app" -w /app lua-yar-e2e bash test/e2e/concurrent_e2e.sh native-tcp
