name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
  workflow_dispatch:
  # benchmark 跑完（更新了 gh-pages 分支的 benchmark/）后重新部署文档站，
  # 让站点内 /perf/benchmark/ 性能看板同步最新数据
  workflow_run:
    workflows: ["Benchmark"]
    types: [completed]
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install mkdocs-material

      - name: Generate perf wrapper page
        # docs/perf/index.md 不提交到仓库——CI 中动态生成 iframe wrapper，
        # 避免源文件和 gh-pages 拷贝的 dashboard 产物混淆。
        run: |
          mkdir -p docs/perf
          cat > docs/perf/index.md << 'WRAPPER'
          # Benchmark

          <iframe
            src="benchmark/"
            style="width: 100%; height: calc(100vh - 180px); min-height: 600px; border: none;"
            loading="lazy"
          ></iframe>

          ??? note "看不到看板？"
              性能看板在 CI 部署后可见。直接访问
              [fangfengxiang.github.io/lua-yar/perf/benchmark/](https://fangfengxiang.github.io/lua-yar/perf/benchmark/)。
          WRAPPER

      - run: mkdocs build
      - name: Copy benchmark dashboard into site
        # 在临时独立 git 仓库中 clone gh-pages，把 benchmark/ 打 tar 后拷进 site/perf/benchmark/。
        # 全程不碰 docs 仓库自身的 .git，无 merge / checkout / HEAD 变更——纯文件拷贝。
        # benchmark.yml(benchmark-data-dir-path: benchmark) 把看板写到 gh-pages 分支 benchmark/；
        # 此处 copy 进 mkdocs 产物，公开 URL 为 https://.../lua-yar/perf/benchmark/。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p site/perf
          tmp=$(mktemp -d)
          git clone --depth 1 --no-checkout \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$tmp" -b gh-pages 2>/dev/null || { echo "gh-pages branch not found, skip"; exit 0; }
          git -C "$tmp" archive HEAD benchmark 2>/dev/null | tar -x -C site/perf || { echo "benchmark not on gh-pages yet, skip"; }
          rm -rf "$tmp"
          if [ -f site/perf/benchmark/index.html ]; then echo "benchmark dashboard copied into site/perf/benchmark:"; ls -la site/perf/benchmark; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
