name: Release

# Triggered when a version tag (v*) is pushed.
# Convention: tag name = v<version>, e.g. v0.1.0, v0.2.0-rc1
#
# Rockspec strategy (industry convention, same as lua-resty-http / lua-cjson):
#   - Only lua-yar-scm-1.rockspec lives in the repo (single source of truth)
#   - Versioned rockspec is GENERATED by CI from scm at release time
#   - Revision (-1, -2, ...) is auto-determined by querying luarocks.org:
#       new version  → rev 1
#       re-publish   → max(existing rev) + 1
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # Required to create releases and upload assets

jobs:
  # ── Generate versioned rockspec from scm, auto-determine revision ──
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.revision.outputs.revision }}
      rockspec: ${{ steps.rockspec.outputs.rockspec }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        # v0.1.0 -> 0.1.0,  v0.2.0-rc1 -> 0.2.0-rc1
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Sync version across all sources
        # Auto-fix version drift before publishing. Runs version-manager.sh
        # sync (driven by .versions, shared with release.sh) to
        # align all version sources to the tag version. If any file changed,
        # commit + push to main; then run check to verify consistency.
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Tag version: $VERSION"
          chmod +x scripts/version-manager.sh
          if scripts/version-manager.sh sync "$VERSION"; then
            echo "No version drift — all sources at $VERSION"
          else
            echo "Version drift detected and auto-synced, committing to main"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $(scripts/version-manager.sh list)
            git commit -m "chore: sync version to $VERSION [skip ci]"
            git push origin HEAD:main || \
              echo "::warning::Could not push version sync to main (new commits after tag). Version synced in CI workspace only."
          fi
          # Verify consistency — fail the job if any source is still wrong
          scripts/version-manager.sh check "$VERSION"

      - name: Setup Lua
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: '5.1'

      - name: Setup LuaRocks
        uses: leafo/gh-actions-luarocks@v6

      - name: Determine revision (query luarocks.org)
        id: revision
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Query luarocks.org for existing revisions of this version
          # porcelain output: "lua-yar  0.1.0-1  rock"
          EXISTING=$(luarocks search lua-yar --porcelain 2>/dev/null \
            | awk '/^lua-yar/ {print $2}' \
            | grep "^${VERSION}-" \
            | sed "s/^${VERSION}-//" \
            | sort -V \
            | tail -1)
          if [ -n "$EXISTING" ]; then
            REV=$((EXISTING + 1))
            echo "Version ${VERSION} already on luarocks.org (rev ${EXISTING}), bumping to rev ${REV}"
          else
            REV=1
            echo "New version ${VERSION}, using rev 1"
          fi
          echo "revision=${REV}" >> $GITHUB_OUTPUT

      - name: Generate versioned rockspec from scm
        id: rockspec
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          REV="${{ steps.revision.outputs.revision }}"
          ROCKSPEC="lua-yar-${VERSION}-${REV}.rockspec"
          # Transform scm -> versioned: version string + source (branch -> tag)
          sed -e "s/version = \"scm-1\"/version = \"${VERSION}-${REV}\"/" \
              -e "s/branch = \"main\"/tag = \"v${VERSION}\"/" \
              lua-yar-scm-1.rockspec > "$ROCKSPEC"
          echo "=== Generated ${ROCKSPEC} ==="
          cat "$ROCKSPEC"
          echo "rockspec=${ROCKSPEC}" >> $GITHUB_OUTPUT

      - name: Upload rockspec artifact
        uses: actions/upload-artifact@v4
        with:
          name: rockspec
          path: lua-yar-*.rockspec

  # ── Create GitHub Release with tarball + rockspec ──
  release:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download rockspec
        uses: actions/download-artifact@v4
        with:
          name: rockspec

      - name: Create source tarball
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          git archive --format=tar.gz \
            --prefix=lua-yar-${VERSION}/ \
            -o lua-yar-${VERSION}.tar.gz HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: lua-yar v${{ needs.prepare.outputs.version }}
          body: |
            纯 Lua 实现的 Yar RPC 协议框架，兼容 PHP Yar / yar-c 互操作。

            ## 安装

            ```bash
            luarocks install lua-yar
            ```

            ## 主要特性

            - JSON / Msgpack 双 packager（纯 Lua 实现）
            - HTTP / TCP 双传输，支持 `http://` `https://` `tcp://` `unix://`
            - OpenResty cosocket 注入（`Client.set_socket(ngx.socket)`）
            - 结构化 Error 对象（5 类错误码）
            - 零 C 扩展依赖，网络层可插拔

            ## 文档

            - [README](https://github.com/fangfengxiang/lua-yar#readme)
            - [API 文档](https://github.com/fangfengxiang/lua-yar/blob/main/docs/api.md)
            - [完整变更日志](https://github.com/fangfengxiang/lua-yar/blob/main/CHANGELOG.md)
          generate_release_notes: true
          # Tags containing a hyphen (e.g. v0.1.0-rc1) are pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            lua-yar-${{ needs.prepare.outputs.version }}.tar.gz
            ${{ needs.prepare.outputs.rockspec }}

      - name: Deploy approval link
        run: |
          URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "LuaRocks/OPM waiting for approval: $URL"
          {
            echo "## LuaRocks / OPM 等待审批"
            echo ""
            echo "release 已完成，luarocks/opm 已暂停等待审批。点击下面链接进入审批："
            echo ""
            echo "审批发布: [$URL]($URL)"
            echo ""
            echo "到 run 页面顶部点 \`Review deployments\` → 选 \`deploy\` → Approve"
          } >> $GITHUB_STEP_SUMMARY

  # ── Publish to LuaRocks.org ──
  # Requires LUAROCKS_API_KEY secret (Settings → Secrets → Actions).
  # If not configured, upload is skipped; lint still runs.
  luarocks:
    needs: [release, prepare]
    environment: deploy   # waits for manual approval in GitHub UI before uploading
    runs-on: ubuntu-latest
    env:
      LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Download rockspec
        uses: actions/download-artifact@v4
        with:
          name: rockspec

      - name: Setup Lua
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: '5.1'

      - name: Setup LuaRocks
        uses: leafo/gh-actions-luarocks@v6

      - name: Lint rockspec
        run: luarocks lint "${{ needs.prepare.outputs.rockspec }}"

      - name: Upload to LuaRocks
        if: ${{ env.LUAROCKS_API_KEY != '' }}
        run: luarocks upload "${{ needs.prepare.outputs.rockspec }}" --api-key="$LUAROCKS_API_KEY"

  # ── Publish to OPM (OpenResty Package Manager) ──
  # Requires OPM_USERNAME (repository variable) and OPM_PASSWORD (secret).
  # Register at https://opm.openresty.org
  # If not configured, build runs but upload is skipped.
  opm:
    needs: release
    environment: deploy   # waits for manual approval in GitHub UI before uploading
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Sync version to tag (local, no commit)
        # Ensure all version sources match the tag before opm build.
        # prepare job already syncs + commits to main, but this job checks
        # out the tag (detached HEAD) so we re-sync locally in the workspace.
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          chmod +x scripts/version-manager.sh
          scripts/version-manager.sh sync "$VERSION" || true
          scripts/version-manager.sh check "$VERSION"

      - name: Install OpenResty (includes opm CLI)
        run: |
          wget -qO - https://openresty.org/package/pubkey.gpg \
            | sudo gpg --dearmor -o /usr/share/keyrings/openresty.gpg
          echo "deb [signed-by=/usr/share/keyrings/openresty.gpg] http://openresty.org/package/ubuntu $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/openresty.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq openresty

      - name: Configure opm
        run: |
          echo "github_account=${{ github.repository_owner }}" > ~/.opmrc
          echo "upload_server=https://opm.openresty.org" >> ~/.opmrc
          echo "download_server=https://opm.openresty.org" >> ~/.opmrc

      - name: Build OPM package
        run: |
          export PATH=/usr/local/openresty/bin:$PATH
          opm build

      - name: Upload to OPM
        if: ${{ vars.OPM_USERNAME != '' }}
        env:
          OPM_PASSWORD: ${{ secrets.OPM_PASSWORD }}
        run: |
          export PATH=/usr/local/openresty/bin:$PATH
          echo "github_token=$OPM_PASSWORD" >> ~/.opmrc
          opm upload

