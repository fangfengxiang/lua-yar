name: Release

# Triggered when a version tag (v*) is pushed.
# Convention: tag name = v<version>, e.g. v0.1.0, v0.2.0-rc1
# The tag must match an existing rockspec: lua-yar-<version>-<revision>.rockspec
# CI picks the highest revision if multiple exist (e.g. 0.1.0-2 > 0.1.0-1)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # Required to create releases and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        # v0.1.0 -> 0.1.0,  v0.2.0-rc1 -> 0.2.0-rc1
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Find rockspec (highest revision)
        run: |
          ROCKSPEC=$(ls lua-yar-${{ steps.version.outputs.version }}-*.rockspec 2>/dev/null | sort -V | tail -1)
          if [ -z "$ROCKSPEC" ]; then
            echo "::error::No rockspec found for version ${{ steps.version.outputs.version }}"
            exit 1
          fi
          echo "Using rockspec: $ROCKSPEC"
          echo "rockspec=$ROCKSPEC" >> $GITHUB_ENV

      - name: Create source tarball
        run: |
          git archive --format=tar.gz \
            --prefix=lua-yar-${{ steps.version.outputs.version }}/ \
            -o lua-yar-${{ steps.version.outputs.version }}.tar.gz HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: lua-yar v${{ steps.version.outputs.version }}
          body: |
            纯 Lua 实现的 Yar RPC 协议框架，兼容 PHP Yar / yar-c 互操作。

            ## 安装

            ```bash
            luarocks install lua-yar
            ```

            ## 主要特性

            - JSON / Msgpack 双 packager（纯 Lua 实现）
            - HTTP / TCP 双传输，支持 `http://` `https://` `tcp://` `unix://`
            - OpenResty cosocket 注入（`Client.set_socket(ngx.socket)`）
            - 结构化 Error 对象（5 类错误码）
            - 零 C 扩展依赖，网络层可插拔

            ## 文档

            - [README](https://github.com/fangfengxiang/lua-yar#readme)
            - [API 文档](https://github.com/fangfengxiang/lua-yar/blob/main/docs/api.md)
            - [完整变更日志](https://github.com/fangfengxiang/lua-yar/blob/main/CHANGELOG.md)
          # Append auto-generated commit list after the body above
          generate_release_notes: true
          # Tags containing a hyphen (e.g. v0.1.0-rc1) are pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            lua-yar-${{ steps.version.outputs.version }}.tar.gz
            ${{ env.rockspec }}

  # --- Publish to LuaRocks.org ---
  # Requires LUAROCKS_API_KEY secret (Settings → Secrets → Actions).
  # If not configured, upload is skipped; lint still runs.
  luarocks:
    runs-on: ubuntu-latest
    needs: release
    env:
      LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Find rockspec (highest revision)
        run: |
          ROCKSPEC=$(ls lua-yar-${{ steps.version.outputs.version }}-*.rockspec 2>/dev/null | sort -V | tail -1)
          if [ -z "$ROCKSPEC" ]; then
            echo "::error::No rockspec found for version ${{ steps.version.outputs.version }}"
            exit 1
          fi
          echo "Using rockspec: $ROCKSPEC"
          echo "rockspec=$ROCKSPEC" >> $GITHUB_ENV

      - name: Setup Lua
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: '5.1'

      - name: Setup LuaRocks
        uses: leafo/gh-actions-luarocks@v6

      - name: Lint rockspec
        run: luarocks lint "${{ env.rockspec }}"

      - name: Upload to LuaRocks
        if: ${{ env.LUAROCKS_API_KEY != '' }}
        run: luarocks upload "${{ env.rockspec }}" --api-key="$LUAROCKS_API_KEY"

  # --- Publish to OPM (OpenResty Package Manager) ---
  # Requires OPM_USERNAME (repository variable) and OPM_PASSWORD (secret).
  # Register at https://opm.openresty.org
  # If not configured, build runs but upload is skipped.
  opm:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Verify dist.ini version matches tag
        run: |
          DIST_VERSION=$(grep '^version' dist.ini | head -1 | awk '{print $3}')
          if [ "$DIST_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::dist.ini version ($DIST_VERSION) does not match tag (${{ steps.version.outputs.version }})"
            exit 1
          fi

      - name: Install OpenResty (includes opm CLI)
        run: |
          wget -qO - https://openresty.org/package/pubkey.gpg \
            | sudo gpg --dearmor -o /usr/share/keyrings/openresty.gpg
          echo "deb [signed-by=/usr/share/keyrings/openresty.gpg] http://openresty.org/package/ubuntu $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/openresty.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq openresty

      - name: Configure opm
        run: |
          echo "github_account=${{ github.repository_owner }}" > ~/.opmrc
          echo "upload_server=https://opm.openresty.org" >> ~/.opmrc
          echo "download_server=https://opm.openresty.org" >> ~/.opmrc

      - name: Build OPM package
        run: |
          export PATH=/usr/local/openresty/bin:$PATH
          opm build

      - name: Upload to OPM
        if: ${{ vars.OPM_USERNAME != '' }}
        env:
          OPM_PASSWORD: ${{ secrets.OPM_PASSWORD }}
        run: |
          export PATH=/usr/local/openresty/bin:$PATH
          echo "github_token=$OPM_PASSWORD" >> ~/.opmrc
          opm upload
